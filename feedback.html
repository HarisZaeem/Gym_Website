<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta http-equiv="X-UA-Compatible" content="IE=edge" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Feedback</title>
  <style>
    body {
      background-image: url('1.picture.jpeg');
      background-size: cover;
      background-repeat: no-repeat;
      margin: 0;
      font-family: Arial, sans-serif;
    }

    h1 {
      color: rgb(0, 0, 0);
      text-align: center;
      margin-top: 40px;
      font-size: 36px;
    }

    .container {
      width: 60%;
      margin: auto;
      background-color: rgba(0, 0, 0, 0.7);
      padding: 30px;
      border-radius: 10px;
      color: white;
    }

    form {
      display: flex;
      flex-direction: column;
      gap: 15px;
    }

    label {
      font-size: 16px;
      margin-bottom: 5px;
    }

    input[type="text"],
    input[type="email"],
    textarea,
    select {
      padding: 10px;
      border-radius: 5px;
      border: none;
      width: 100%;
    }

    input[type="radio"] {
      margin-right: 5px;
    }

    .radio-group {
      display: flex;
      gap: 15px;
      align-items: center;
    }

    input[type="submit"],
    input[type="reset"] {
      background-color: rgb(250, 88, 29);
      color: white;
      padding: 12px;
      font-size: 16px;
      border: none;
      border-radius: 5px;
      cursor: pointer;
    }

    input[type="submit"]:hover,
    input[type="reset"]:hover {
      background-color: rgb(220, 60, 20);
    }

    .text2 {
      color: rgb(250, 88, 29);
      text-align: center;
      margin-top: 50px;
      border: 2px solid black;
      background-color: lightgray;
      padding: 10px;
    }

    .navbar {
      overflow: hidden;
      background-color: white;
      font-family: fantasy;
      width: 728px;
      border-radius: 7px;
      margin-left: 650px;
      margin-top: -145px;
    }

    .navbar a {
      float: left;
      font-size: 15px;
      color: black;
      text-align: center;
      padding: 10px 15px;
      text-decoration: none;
    }

    .dropdown {
      float: left;
      overflow: hidden;
    }

    .dropdown .dropbtn {
      font-size: 15px;
      border: none;
      outline: none;
      color: black;
      padding: 10px 15px;
      background-color: inherit;
      font-family: inherit;
      margin: 0;
    }

    .navbar a:hover,
    .dropdown:hover .dropbtn {
      background-color: rgb(250, 88, 29);
    }

    .dropdown-content {
      display: none;
      position: absolute;
      background-color: #f9f9f9;
      min-width: 160px;
      box-shadow: 0px 8px 16px rgba(0, 0, 0, 0.2);
      z-index: 1;
    }

    .dropdown-content a {
      float: none;
      color: black;
      padding: 10px 15px;
      text-decoration: none;
      display: block;
      text-align: left;
    }

    .dropdown-content a:hover {
      background-color: rgb(250, 88, 29);
    }

    .dropdown:hover .dropdown-content {
      display: block;
    }
  </style>
</head>
<body>
  <div class="logo">
    <img src="360_F_111970319_8UEeH6AAEa8vWnc5TVUCPhKKsYtLzm5y-removebg-preview.png" alt="logo" height="150px">
  </div>

  <div class="navbar">
    <a href="home1.html">HOME</a>
    <a href="aboutus.html">ABOUT US</a>
    <div class="dropdown">
      <button class="dropbtn">WORKOUT</button>
      <div class="dropdown-content">
        <a href="workoutschedules.html">WORKOUT SCHEDULES</a>
        <a href="onlineworkout.html">ONLINE WORKOUT</a>
      </div>
    </div>
    <a href="mealplan.html">MEAL PLAN</a>
    <a href="personaltrainer.html">PERSONAL TRAINER</a>
    <a href="faq's.html">FAQ'S</a>
    <a href="contactus.html">CONTACT US</a>
    <a href="feedback.html">FEEDBACK</a>
  </div>

  <h1>We Value Your Feedback</h1>
  <div class="container">
    <form action="mailto:simon.Long@Cit.Ie" method="POST" enctype="text/plain">
      <label>First Name:</label>
      <input type="text" name="Firstname" placeholder="Enter your first name" required>

      <label>Second Name:</label>
      <input type="text" name="Secondname" placeholder="Enter your last name" required>

      <label>Gender:</label>
      <div class="radio-group">
        <label><input type="radio" name="Gender" value="Male"> Male</label>
        <label><input type="radio" name="Gender" value="Female"> Female</label>
      </div>

      <label>Email:</label>
      <input type="email" name="Mail" placeholder="Enter your email" required>

      <label>Comments:</label>
      <textarea name="Commentfield" rows="5" placeholder="Your comments here..."></textarea>

      <label>Rate Us:</label>
      <select name="Rating" required>
        <option value="">-- Select an option --</option>
        <option value="Poor">Poor</option>
        <option value="Average">Average</option>
        <option value="Good">Good</option>
        <option value="Excellent">Excellent</option>
      </select>

      <input type="submit" value="Send Feedback">
      <input type="reset" value="Reset">
    </form>
  </div>

  <footer>
    <div class="text2">
      <p>Copyright © 2020 All Rights Reserved</p>
    </div>
  </footer>
</body>
</html>
